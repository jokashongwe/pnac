{% load i18n %}
<section class="relative overflow-hidden border-b border-gray-100">
    <div class="absolute inset-0 bg-gradient-to-br from-emerald-50 via-white to-sky-50"></div>
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-pnacGreen/5"></div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 md:py-20 text-center">
        {% if eyebrow %}
        <p class="text-pnacGreen font-bold uppercase tracking-widest text-xs mb-3">{{ eyebrow }}</p>
        {% endif %}
        <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 tracking-tight">{{ title }}</h1>
        <div class="h-1 w-16 bg-pnacBlue mx-auto mt-5 rounded-full"></div>
        {% if subtitle %}
        <p class="mt-6 text-lg md:text-xl text-gray-600 max-w-2xl mx-auto leading-relaxed">{{ subtitle }}</p>
        {% endif %}
        {% if extra %}
        <div class="mt-8">{{ extra }}</div>
        {% endif %}
    </div>
</section>
