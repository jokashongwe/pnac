{% load i18n %}
<article class="group h-full bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition duration-300 overflow-hidden flex flex-col">
    <a href="{% url 'post_detail' post.slug %}" class="flex flex-col h-full focus:outline-none focus-visible:ring-2 focus-visible:ring-pnacGreen">
        <div class="relative h-52 overflow-hidden bg-gray-100">
            {% if post.image %}
                <img src="{{ post.image.url }}" alt="{{ post.title }}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
            {% else %}
                <div class="w-full h-full flex items-center justify-center text-gray-300 font-extrabold text-3xl">PNAC</div>
            {% endif %}
            <span class="absolute top-4 left-4 bg-white/95 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-pnacGreen uppercase tracking-wide shadow-sm">
                {{ post.get_category_display }}
            </span>
        </div>
        <div class="p-6 flex-1 flex flex-col">
            <time datetime="{{ post.created_at|date:'Y-m-d' }}" class="text-sm text-gray-400 mb-2">{{ post.created_at|date:"d M Y" }}</time>
            <h2 class="text-xl font-bold text-gray-900 mb-3 leading-snug group-hover:text-pnacGreen transition">{{ post.title }}</h2>
            <p class="text-gray-600 text-sm leading-relaxed line-clamp-3 flex-1">{{ post.excerpt }}</p>
            <span class="mt-5 inline-flex items-center text-pnacGreen font-bold text-sm">
                {% trans "Lire l'article" %}
                <svg class="w-4 h-4 ml-1 transition group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </span>
        </div>
    </a>
</article>
