{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<section class="py-16 bg-gray-50 min-h-[70vh]">
    <div class="max-w-md mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-lg p-8 border-t-4 border-pnacBlue">
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">{% trans "Vérification du téléphone" %}</h1>
            <p class="text-gray-500 mb-6">
                {% trans "Un code SMS a été envoyé au numéro" %} <strong>{{ phone }}</strong>.
            </p>
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">{{ form.code.label }}</label>
                    {{ form.code }}
                    {{ form.code.errors }}
                </div>
                <button type="submit" class="w-full py-3 bg-pnacBlue hover:bg-blue-600 text-white font-bold rounded-lg">
                    {% trans "Valider le code" %}
                </button>
            </form>
            <form method="post" action="{% url 'member_otp_resend' %}" class="mt-4 text-center">
                {% csrf_token %}
                <button type="submit" class="text-sm text-pnacGreen font-semibold hover:underline">
                    {% trans "Renvoyer le SMS" %}
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
