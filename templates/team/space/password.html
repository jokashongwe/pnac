{% extends 'base.html' %}
{% load i18n %}

{% block content %}
{% include 'team/space/_nav.html' %}
<section class="py-10 bg-gray-50 min-h-[70vh]">
    <div class="max-w-lg mx-auto px-4">
        <div class="bg-white rounded-xl shadow-sm p-8">
            <h1 class="text-2xl font-bold mb-6">{% trans "Changer le mot de passe" %}</h1>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
                {% endfor %}
                <button type="submit" class="w-full py-3 bg-pnacGreen text-white font-bold rounded-lg">{% trans "Enregistrer" %}</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
